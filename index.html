<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MonguHelper">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MonguHelper</title>
<script>try{var l=localStorage.getItem('mongu-lang');document.documentElement.dir=l==='en'?'ltr':'rtl'}catch(e){document.documentElement.dir='rtl'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header with person switch, pen gauge as the hero, bottom tab bar */
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunk:#e3e8e5; --ink:#17221e; --muted:#5b6a64; --line:#d3dbd7;
  --accent:#1f6b5c; --accent-ink:#ffffff; --accent-soft:#d8ebe5;
  --p0:#c0562f; --p1:#3866a6; --p2:#7a4fa3; --p3:#2e8a57; --p4:#9a7a12; --p5:#c23a6b;
  --warn:#a8711a; --warn-soft:#f5e8cf; --bad:#ad3636;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e7eeeb; --muted:#97a6a0; --line:#2a3531;
  --accent:#4fb39c; --accent-ink:#0b1412; --accent-soft:#1c3530;
  --p0:#e88a63; --p1:#7fa6e0; --p2:#b896e0; --p3:#6cc48f; --p4:#e0c060; --p5:#e8799f;
  --warn:#e0a94a; --warn-soft:#382b14; --bad:#e07777; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e7eeeb; --muted:#97a6a0; --line:#2a3531;
  --accent:#4fb39c; --accent-ink:#0b1412; --accent-soft:#1c3530;
  --p0:#e88a63; --p1:#7fa6e0; --p2:#b896e0; --p3:#6cc48f; --p4:#e0c060; --p5:#e8799f;
  --warn:#e0a94a; --warn-soft:#382b14; --bad:#e07777; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.titlebar h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn.gear{padding:7px;display:grid;place-items:center;color:var(--ink)}
.langseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langseg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:600}
.langseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bkgrid .btn{padding:11px 10px;font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:7px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}

.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--pc)}
.pcard .nm{font-family:var(--display);font-weight:600;font-size:15px}
.pcard .big{font-family:var(--display);font-size:17px;font-weight:600}
.pcard .sub{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--warn-soft);color:var(--bad)}

.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}

/* pen gauge */
.pen{display:flex;flex-direction:column;gap:10px}
.pen .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pen .remain{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.clkline{display:block;font-size:13px;font-weight:600;color:var(--accent);margin-top:6px;text-align:end}
.pen .remain small{font-size:15px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.barrel{position:relative;height:30px;border-radius:15px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--line)}
.barrel span{height:100%}
.barrel .left{background:var(--accent-soft)}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.forecast{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.fc{background:var(--sunk);border-radius:12px;padding:10px 12px}
.fc b{display:block;font-family:var(--display);font-size:16px;font-weight:600}
.fc span{font-size:12px;color:var(--muted)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.full{width:100%}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tag{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px}
.item .main{min-width:0}
.item .t{font-weight:600}
.item .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.del{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:6px 8px;border-radius:8px}
.del.arm{background:var(--warn-soft);color:var(--bad);font-weight:600}
.dayhead{font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--muted);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0;color:var(--muted)}
.srow b{font-family:var(--display);font-size:16px;min-width:44px;text-align:end}

.acts{display:flex;gap:2px}
.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;padding-block:4px}
.more .grid2{margin-top:10px}
.dcard{border-top:3px solid var(--pc)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead .nm{font-family:var(--display);font-weight:600;font-size:16px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero .lbl,.simres .lbl{font-size:12.5px;color:var(--muted);display:block}
.hero b{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:var(--pc)}
.hero b small{font-size:15px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.hero .side{display:flex;flex-direction:column;font-size:13px;color:var(--muted);text-align:end}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m{background:var(--sunk);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.m span{font-size:12px;color:var(--muted)} .m b{font-family:var(--display);font-size:17px}
.dl{font-size:12px;font-weight:600;color:var(--muted)} .dl.up{color:var(--accent)} .dl.dn{color:var(--bad)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tip{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tip b{font-family:var(--display);font-size:14.5px} .tip span{font-size:13px;color:var(--muted)}
.item.mv{grid-template-columns:1fr auto}
.simrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.simrow .nm{font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;width:40px;height:40px;font-size:20px;font-weight:600;color:var(--accent)}
.stepper input{width:64px;border:0;background:transparent;text-align:center;font-family:var(--display);font-size:17px;font-weight:600;padding:0}
.simres b{font-family:var(--display);font-size:28px;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display)}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;direction:ltr}

nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 2px 12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:360px){.people{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.barrel span{transition:width .4s ease}}
.scan{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.scan .btn{padding:9px 14px;font-size:14px}
.scan span{font-size:13px;color:var(--accent);flex:1;min-width:140px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.swatch{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="titlebar">
      <h1 dir="ltr" style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--accent)"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 1 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg>MonguHelper</h1>
      <button class="iconbtn gear" id="btnSettings" type="button" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="seg" id="whoSeg" role="group" aria-label="عرض بيانات"></div>
  </header>
  <section class="people" id="people"></section>
  <main id="main" class="wrap"></main>
  <p class="note" id="storeNote">جاري التحميل…</p>
</div>

<nav class="tabs" aria-label="الأقسام"><div class="in" id="tabs"></div></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const COLLS=['pens','doses','meals','weights'];
const APP={clicks:60};
const S={people:{a:{name:'شخص ١',c:0},b:{name:'شخص ٢',c:1}},pens:[],doses:[],meals:[],weights:[]};
let view='dash', who='all', db=null, mode='loading', sampleFn=null, canImg=false;
let lang='ar';try{const l=localStorage.getItem('mongu-lang');if(l==='en'||l==='ar')lang=l}catch{}
const L=(a,e)=>lang==='en'?e:a;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const toD=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const loc=()=>lang==='en'?'en-GB':'ar-EG-u-nu-latn';
const fmtDate=s=>{try{return new Intl.DateTimeFormat(loc(),{weekday:'short',day:'numeric',month:'short'}).format(toD(s))}catch{return s}};
const fmtShort=s=>{try{return new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(toD(s))}catch{return s}};
const n=(x,d=1)=>{const v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);return String(v)};
const MG=()=>L('مجم','mg'),KG=()=>L('كجم','kg');
const TYPES={'فطار':'Breakfast','غدا':'Lunch','عشا':'Dinner','سناك':'Snack'};
const SITES={'البطن':'Belly','الفخذ':'Thigh','الدراع':'Arm'};
const tr=(map,v)=>lang==='en'?(map[v]||v):v;
const PIDS=()=>Object.keys(S.people).sort((x,y)=>(S.people[x].c??0)-(S.people[y].c??0)||x.localeCompare(y));
const cidx=p=>((S.people[p]?.c??0)%6+6)%6;
const col=p=>`var(--p${cidx(p)})`;
const soft=p=>`color-mix(in srgb, var(--p${cidx(p)}) 18%, var(--surface))`;
const pname=p=>esc(S.people[p]?.name||L('شخص','Person'));
const dot=p=>`<span class="dot" style="background:${col(p)}"></span>`;
const tag=p=>`<span class="tag" style="background:${soft(p)};color:${col(p)}">${esc((S.people[p]?.name||'?').trim().charAt(0))}</span>`;
const byDateDesc=(x,y)=>(y.date||'').localeCompare(x.date||'')||(y.ts||0)-(x.ts||0);
const inWho=r=>who==='all'||r.person===who;
const shown=()=>who==='all'?PIDS():[who];
const penTitle=p=>esc(p.label||(p.strength?L('قلم ','Pen ')+n(+p.strength):L('قلم ','Pen ')+n(+p.total)+' '+MG()));
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}

/* ---------- storage ---------- */
const LKEY='mounjaro-tracker-v1';
function loadLocal(){try{const raw=localStorage.getItem(LKEY);if(raw){const o=JSON.parse(raw);Object.assign(S,o);S.people=parsePeople(o.people);if(o.app&&+o.app.clicks>0)APP.clicks=+o.app.clicks}}catch{}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({...S,app:APP}))}catch{}}
async function saveApp(){if(db){try{await db.doc('settings/app').set({...APP})}catch(e){fail(e)}}else{saveLocal()}render()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function parsePeople(d){
  const out={};let i=0;
  Object.keys(d||{}).sort().forEach(k=>{const v=d[k];if(v&&typeof v==='object'&&typeof v.name==='string'){out[k]={name:v.name,c:typeof v.c==='number'?v.c:(k==='a'?0:k==='b'?1:i)};}i++});
  return Object.keys(out).length?out:{a:{name:'شخص ١',c:0},b:{name:'شخص ٢',c:1}};
}
async function addRow(c,data){
  const row={...data,ts:Date.now()};
  if(db){try{await db.collection(c).add(row)}catch(e){fail(e)}}
  else{S[c].push({id:uid(),...row});saveLocal();render()}
}
async function updRow(c,id,data){
  if(db){try{await db.collection(c).doc(id).update(data)}catch(e){fail(e)}}
  else{S[c]=S[c].map(r=>r.id===id?{...r,...data}:r);saveLocal();render()}
}
async function delRow(c,id){
  if(db){try{await db.collection(c).doc(id).delete()}catch(e){fail(e)}}
  else{S[c]=S[c].filter(r=>r.id!==id);saveLocal();render()}
}
async function savePeople(p){
  if(db){try{await db.doc('settings/people').set(p)}catch(e){fail(e)}}
  else{S.people=p;saveLocal();render()}
}
function fail(e){
  const c=e&&e.code;
  toast(c==='invalid_argument'?L('مش مسموح لك تعدّل هنا — اطلب صلاحية تعديل من صاحب الصفحة','You can’t edit here. Ask the owner for edit access.'):c==='quota_exceeded'?L('المساحة اتملت، امسح سجلات قديمة','Storage is full. Delete some old entries.'):L('حصلت مشكلة في الحفظ، جرّب تاني','Couldn’t save. Try again.'));
}
async function initStore(){
  const cl=window.claude;
  if(cl&&cl.use){
    cl.use('sample').then(async f=>{sampleFn=f;if(f){try{const Lm=await f.limits();canImg=!!Lm.images}catch{canImg=false}}if(view==='weights')render()}).catch(()=>{});
    try{db=await cl.use('db')}catch{db=null}
  }
  if(!db){mode='local';loadLocal();render();return}
  mode='db';
  COLLS.forEach(c=>{
    db.collection(c).orderBy('ts','desc').limit(1000).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  });
  db.doc('settings/app').onSnapshot(s=>{if(s.exists){const d=s.data();if(+d.clicks>0)APP.clicks=+d.clicks;render()}},()=>{});
  db.doc('settings/people').onSnapshot(s=>{if(s.exists){S.people=parsePeople(s.data());if(who!=='all'&&!S.people[who])who='all';render()}},()=>{});
  render();
}

/* ---------- calculations ---------- */
function penUsage(p){
  const ds=S.doses.filter(d=>d.pen===p.id);const by={};
  ds.forEach(d=>{by[d.person]=(by[d.person]||0)+(+d.mg||0)});
  const used=Object.values(by).reduce((a,b)=>a+b,0),total=+p.total||0;
  return {by,used,remaining:Math.max(0,total-used),total,count:ds.length};
}
function activePen(){
  const pens=[...S.pens].sort((x,y)=>(y.opened||'').localeCompare(x.opened||'')||(y.ts||0)-(x.ts||0));
  return pens.find(p=>penUsage(p).remaining>0.01)||pens[0]||null;
}
function lastDose(person){return S.doses.filter(d=>d.person===person).sort(byDateDesc)[0]||null}
function simulate(rem,plan,every){
  plan=plan.map(x=>({...x,covered:0}));const tl=[];let emptyOn=null,g=0;
  if(!plan.length)return {plan,tl,emptyOn,leftover:rem};
  while(g++<300){
    plan.sort((x,y)=>x.next.localeCompare(y.next));const nx=plan[0];
    if(rem+1e-9<nx.mg){emptyOn=nx.next;break}
    rem-=nx.mg;nx.covered++;tl.push({date:nx.next,p:nx.p,mg:nx.mg,rem});nx.next=addDays(nx.next,every);
  }
  return {plan,tl,emptyOn,leftover:rem};
}
function planFrom(doses,every){
  return PIDS().map(p=>{const mg=doses[p];if(!(mg>0))return null;const l=lastDose(p);
    let next=l?addDays(l.date,every):today();if(next<today())next=today();return {p,mg,next}}).filter(Boolean);
}
function currentDoses(){const o={};PIDS().forEach(p=>{const l=lastDose(p);if(l&&daysBetween(l.date,today())<=28)o[p]=+l.mg});return o}
function forecast(pen){
  const u=penUsage(pen);const cur=currentDoses();
  const r=simulate(u.remaining,planFrom(cur,7),7);
  return {u,plan:r.plan,emptyOn:r.emptyOn,weekly:Object.values(cur).reduce((a,b)=>a+b,0)};
}
function barrel(u){return `<div class="barrel" role="img" aria-label="${n(u.remaining)} / ${n(u.total)} ${MG()}">${PIDS().filter(p=>u.by[p]).map(p=>`<span style="width:${u.total?Math.min(100,u.by[p]/u.total*100):0}%;background:${col(p)}"></span>`).join('')}<span class="left" style="flex:1"></span></div>`}
const perDose=p=>+(p&&p.clicks)>0?+p.clicks:+APP.clicks;
const clk=(mg,p)=>p&&+p.strength>0&&perDose(p)>0&&mg>0?mg/+p.strength*perDose(p):null;
const penClk=(p,mg)=>{const c=clk(mg,p);return c==null?'':` ≈ ${n(c,0)} ${L('تكة','clicks')}`};
const clkTxt=x=>x==null?'':`≈ ${n(x,0)} ${L('تكة','clicks')}`;
const acts=(c,id)=>`<span class="acts"><button class="del" type="button" data-edit="${c}:${id}">${L('تعديل','Edit')}</button><button class="del" type="button" data-del="${c}:${id}">${L('حذف','Delete')}</button></span>`;

      if(f.emptyOn){const d=daysBetween(today(),f.emptyOn);fc.push(`<div class="fc" style="background:var(--warn-soft)"><b>${fmtDate(f.emptyOn)}</b><span>${L('محتاجين قلم جديد قبل اليوم ده','You’ll need a new pen by this day')}${d>=0?L(` (بعد ${d} يوم)`,` (in ${d} days)`):''}</span></div>`)}

    penHtml=`<div class="card pen">
      <div class="head"><div><h2>${penTitle(pen)}</h2><span class="muted num">${L('اتفتح','Opened')} ${fmtShort(pen.opened)}</span></div>
      <div class="remain num">${n(u.remaining)}<small>${L('من','of')} ${n(u.total)} ${MG()}</small>${clk(u.remaining,pen)!=null?`<span class="clkline">${L('فاضل','left')} ≈ ${n(clk(u.remaining,pen),0)} ${L('تكة','clicks')} ${L('من','of')} ${n(clk(u.total,pen),0)}</span>`:''}</div></div>
      ${barrel(u)}
      <div class="ticks num">${PIDS().filter(p=>u.by[p]).map(p=>`<span>${dot(p)}${pname(p)} ${n(u.by[p])} ${MG()}</span>`).join('')}</div>

  const list=ds.length?`<div class="list">${ds.map(d=>`<div class="item">${tag(d.person)}
    <div class="main"><div class="t num">${n(+d.mg)} ${MG()}${(()=>{const c=clk(+d.mg,S.pens.find(x=>x.id===d.pen));return c?' ('+clkTxt(c)+')':''})()} · ${fmtDate(d.date)}</div><div class="d">${pname(d.person)} · ${esc(tr(SITES,d.site||''))} · ${penName(d.pen)}${d.note?' · '+esc(d.note):''}</div></div>
    ${acts('doses',d.id)}</div>`).join('')}</div>`
    :`<div class="empty"><span>${L('مفيش جرعات متسجلة.','No doses logged.')}</span></div>`;
  return penHtml+`<button class="btn full" data-open="dose" type="button" ${S.pens.length?'':'disabled style="opacity:.5"'}>${L('سجّل جرعة','Log a dose')}</button>

function wSeries(p){return S.weights.filter(w=>w.person===p).sort((x,y)=>(x.date||'').localeCompare(y.date||'')||(x.ts||0)-(y.ts||0))}
function chart(){
  const ser=shown().map(p=>({p,pts:wSeries(p)})).filter(s=>s.pts.length);
  const all=ser.flatMap(s=>s.pts);if(all.length<2)return '';
  const W=520,H=200,Lf=40,R=12,T=14,B=28;
  const dates=all.map(w=>toD(w.date).getTime()),d0=Math.min(...dates),d1=Math.max(...dates);
  const ks=all.map(w=>+w.kg);let k0=Math.floor(Math.min(...ks)-1),k1=Math.ceil(Math.max(...ks)+1);
  const x=t=>Lf+(d1===d0?0.5:(t-d0)/(d1-d0))*(W-Lf-R),y=k=>T+(1-(k-k0)/(k1-k0))*(H-T-B);
  const grid=[];for(let i=0;i<=4;i++){const k=k0+(k1-k0)*i/4;grid.push(`<line x1="${Lf}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-width="1"/><text x="${Lf-6}" y="${y(k)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${n(k,0)}</text>`)}
  const xl=[d0,d1].filter((t,i)=>i===0||d1!==d0).map((t,i)=>`<text x="${x(t)}" y="${H-8}" text-anchor="${i?'end':'start'}" font-size="11" fill="var(--muted)">${fmtShort(new Date(t).toISOString().slice(0,10))}</text>`).join('');
  const lines=ser.map(s=>{const pts=s.pts.map(w=>[x(toD(w.date).getTime()),y(+w.kg)]);const last=pts[pts.length-1];const c=col(s.p);
    return `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+
    pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${c}"/>`).join('')+`<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('منحنى الوزن','Weight chart')}">${grid.join('')}${xl}${lines}</svg></div>`;
}

/* ---------- dashboard ---------- */
function delta(cur,prev,unit,goodDown){
  if(cur==null||prev==null)return '';const d=cur-prev;if(Math.abs(d)<0.05)return `<span class="dl">${L('ثابت','steady')}</span>`;
  const good=goodDown?d<0:d>0;return `<span class="dl ${good?'up':'dn'}">${d>0?'+':'−'}${n(Math.abs(d))}${unit}</span>`;
}
const METRICS=()=>[['fat',L('الدهون','Body fat'),'%',true],['muscle',L('العضلات','Muscle'),' '+KG(),false],['visceral',L('الدهون الحشوية','Visceral fat'),'',true],['water',L('المياه','Water'),'%',false],['bmi','BMI','',true],['bmr',L('الحرق الأساسي','BMR'),L(' سعر',' kcal'),false],['skeletal',L('العضلات الهيكلية','Skeletal muscle'),' '+KG(),false],['protein',L('البروتين','Protein'),'%',false]];
function personDash(p){
  const s=wSeries(p);const l=lastDose(p);
  const head=`<div class="dhead"><span class="nm">${dot(p)}${pname(p)}</span>${l?`<span class="pill">${L('جرعة','Dose')} ${n(+l.mg)} ${MG()}</span>`:''}</div>`;
  if(!s.length)return `<div class="card dcard" style="--pc:${col(p)}">${head}<div class="empty"><span>${L('سجّل الوزن عشان الداش بورد يشتغل.','Log a weight to fill the dashboard.')}</span></div></div>`;
  const M=METRICS();
  const f=s[0],c=s[s.length-1],lost=+f.kg-+c.kg,days=daysBetween(f.date,c.date),wk=days>0?lost/(days/7):null,pct=lost/(+f.kg)*100;
  const comps=s.filter(w=>M.some(m=>w[m[0]]!=null));const cc=comps[comps.length-1],cp=comps.length>1?comps[comps.length-2]:null;
  const metric=([key,lbl,unit,gd])=>cc&&cc[key]!=null?`<div class="m"><span>${lbl}</span><b class="num">${n(+cc[key])}${unit}</b>${cp&&cp[key]!=null?delta(+cc[key],+cp[key],unit,gd):''}</div>`:'';
  const wk7=S.meals.filter(m=>m.person===p&&daysBetween(m.date,today())<7&&daysBetween(m.date,today())>=0);
  const wkProt=wk7.filter(m=>m.protein),wkK=wk7.filter(m=>m.kcal);

async function saveFile(name,data,type){

    if(dl){await dl.save({filename:name,data:new Blob([data],{type})});toast(L('اتحفظ الملف','File saved'));return}}catch(e){if(e&&e.code==='cancelled')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch{toast(L('مقدرتش أحفظ الملف','Couldn’t save the file'))}
}

async function importJson(file){

  const KEYS=['pens','doses','meals','weights'];let added=0;
  if(d.people&&typeof d.people==='object'){const merged={};PIDS().forEach(p=>merged[p]={name:S.people[p].name,c:cidx(p)});const inc=parsePeople(d.people);Object.keys(inc).forEach(k=>{if(!merged[k])merged[k]=inc[k]});await savePeople(merged)}
  for(const k of KEYS){
    const have=new Set(S[k].map(r=>r.id));const list=Array.isArray(d[k])?d[k]:[];
    for(const r of list){if(!r||typeof r!=='object')continue;const id=String(r.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,120);if(have.has(id))continue;
      const {id:_,...body}=r;
      if(db){try{await db.collection(k).doc(id).set(body);added++}catch(e){fail(e);return}}else{S[k].push({id,...body});added++}}
  }

}

const WFIELDS=()=>[['fFat','fat',L('نسبة الدهون %','Body fat %'),'0.1'],['fMus','muscle',L('العضلات (كجم)','Muscle (kg)'),'0.1'],['fVis','visceral',L('الدهون الحشوية','Visceral fat'),'0.5'],['fWat','water',L('المياه %','Water %'),'0.1'],['fBmi','bmi','BMI','0.1'],['fBmr','bmr','BMR','1'],['fSk','skeletal',L('العضلات الهيكلية (كجم)','Skeletal muscle (kg)'),'0.1'],['fPr','protein',L('البروتين %','Protein %'),'0.1']];
function openSheet(kind,rec){
  const defP=rec?.person||(who==='all'?PIDS()[0]:who);let body='';const ed=!!rec;

    const act=activePen();const last=lastDose(defP);

    <p class="hint">${L('القلم فيه ٤ جرعات من الرقم المكتوب عليه، فالإجمالي = الرقم × ٤ (قلم ١٥ = ٦٠ مجم). لو قلمكم مختلف عدّل الإجمالي.','A pen holds 4 doses of its labeled strength, so total = strength × 4 (a 15 mg pen = 60 mg). Change the total if yours differs.')}</p>
    <div class="grid2"><div class="field"><label for="fTotal">${L('إجمالي القلم (مجم)','Pen total (mg)')}</label><input id="fTotal" type="text" inputmode="decimal" step="0.25" min="0" value="${ed?val(rec.total):60}"></div>
    <div class="field"><label for="fPrice">${L('سعر القلم (اختياري)','Pen price (optional)')}</label><input id="fPrice" type="text" inputmode="decimal" min="0" step="1" value="${ed?val(rec.price):''}" placeholder="${L('بالجنيه','EGP')}"></div></div>

    <div class="field"><label for="fLabel">${L('اسم مميز (اختياري)','Label (optional)')}</label><input id="fLabel" type="text" dir="auto" value="${ed?val(rec.label):''}" placeholder="${L('قلم نوفمبر','November pen')}"></div></div>
    <div class="field"><label for="fClicks">${L('عدد التكات للجرعة الكاملة لو مختلف عن الإعدادات','Clicks per full dose, if different from Settings')}</label><input id="fClicks" type="text" inputmode="numeric" min="1" step="1" value="${ed?val(rec.clicks):''}" placeholder="${n(APP.clicks,0)}"></div>
    <p class="hint">${L('سيبها فاضية عشان القلم ياخد الرقم العام من الإعدادات.','Leave empty to use the general number from Settings.')}</p>`;
  }else if(kind==='meal'){
    const h=new Date().getHours();const t=rec?.type||(h<11?'فطار':h<17?'غدا':h<22?'عشا':'سناك');
    sheetState={person:defP,type:t,editId:rec?.id};
    body=`<h3>${ed?L('تعديل أكلة','Edit meal'):L('تسجيل أكلة','Log a meal')}</h3>

    <div class="field"><label for="fText">${L('أكلت إيه','What did you eat')}</label><textarea id="fText" dir="auto" placeholder="${L('مثلاً: 2 بيض + عيش بلدي + خيار','e.g. 2 eggs, bread, cucumber')}">${ed?val(rec.text):''}</textarea></div>

    <div class="field"><label for="fProt">${L('بروتين تقريبي (جرام)','Approx. protein (g)')}</label><input id="fProt" type="text" inputmode="numeric" min="0" step="1" value="${ed?val(rec.protein):''}" placeholder="${L('اختياري','optional')}"></div></div>
    <div class="field"><label for="fDate">${L('التاريخ','Date')}</label><input id="fDate" type="date" value="${ed?val(rec.date):today()}"></div>`;
  }else if(kind==='weight'){
    sheetState={person:defP,editId:rec?.id};
    const l=wSeries(defP).slice(-1)[0];const WF=WFIELDS();

    <div class="field"><label>${L('مين','Who')}</label>${personChips(defP)}</div>
    ${canImg?`<div class="scan"><button class="btn" type="button" id="scanBtn">${L('ارفع صورة الميزان','Upload scale screenshot')}</button><span id="scanMsg">${L('Claude هيقرا الأرقام من الصورة ويملا الخانات، وانت تراجع وتحفظ.','Claude reads the numbers and fills the fields; you review and save.')}</span><input id="scanFile" type="file" accept="image/*" hidden></div>`:''}
    <div class="grid2"><div class="field"><label for="fKg">${L('الوزن (كجم)','Weight (kg)')}</label><input id="fKg" type="text" inputmode="decimal" step="0.1" min="20" value="${ed?val(rec.kg):(l?+l.kg:'')}"></div>
    <div class="field"><label for="fDate">${L('التاريخ','Date')}</label><input id="fDate" type="date" value="${ed?val(rec.date):today()}"></div></div>
    <details class="more" id="moreBox" ${hasComp?'open':''}><summary>${L('أرقام الميزان الذكي (اختياري)','Smart-scale numbers (optional)')}</summary>
    <div class="grid2">${WF.map(([id,k,lbl,st])=>`<div class="field"><label for="${id}">${lbl}</label><input id="${id}" type="text" inputmode="decimal" step="${st}" value="${ed?val(rec[k]):''}"></div>`).join('')}</div></details>`;
  }else if(kind==='person'){
    const p=rec?S.people[rec]:null;const used=new Set(PIDS().map(cidx));
    const freeC=[0,1,2,3,4,5].find(c=>!used.has(c))??PIDS().length%6;
    sheetState={editId:rec||null,c:String(p?cidx(rec):freeC)};
    body=`<h3>${p?L('تعديل الشخص','Edit person'):L('إضافة شخص','Add person')}</h3>
    <div class="field"><label for="fName">${L('الاسم','Name')}</label><input id="fName" type="text" dir="auto" value="${p?esc(p.name):''}"></div>
    <div class="field"><label>${L('اللون','Color')}</label><div class="colors" data-chips="c">${[0,1,2,3,4,5].map(c=>`<button type="button" data-v="${c}" aria-pressed="${String(c)===sheetState.c}" style="background:var(--p${c})" aria-label="${c+1}"></button>`).join('')}</div></div>`;
  }
  $('#sheetHost').innerHTML=`<div class="scrim" data-close="1"><form class="sheet" id="sheetForm" data-kind="${kind}" novalidate>${body}<div class="actions"><button class="btn" type="submit">${ed?L('حفظ التعديل','Save changes'):L('حفظ','Save')}</button><button class="btn ghost" type="button" data-close="1">${L('إلغاء','Cancel')}</button></div><p class="hint" id="formErr" hidden></p></form></div>`;
  if(kind==='dose')syncClk('mg');
}
function closeSheet(){$('#sheetHost').innerHTML=''}
function err(m){const e=$('#formErr');e.textContent=m;e.hidden=false;e.style.color='var(--bad)'}
async function submitSheet(kind){
  const v=id=>($('#'+id)?.value||'').trim();
  const num=id=>{const x=parseFloat(v(id));return isFinite(x)&&x>0?x:null};
  const eid=sheetState.editId;let data,msg;
  if(kind==='dose'){
    const mg=num('fMg');if(!mg)return err(L('اكتب الجرعة بالمجم','Enter the dose in mg'));
    const pen=v('fPen');if(!pen)return err(L('اختار القلم','Choose a pen'));
    const p=S.pens.find(x=>x.id===pen);const u=p&&penUsage(p);
    if(u&&!eid&&mg>u.remaining+1e-9)toast(L(`تنبيه: القلم ده فاضل فيه ${n(u.remaining)} مجم بس`,`Heads up: this pen only has ${n(u.remaining)} mg left`));
    data={person:sheetState.person,mg,date:v('fDate')||today(),pen,site:sheetState.site,note:v('fNote')};msg=eid?L('اتعدلت الجرعة','Dose updated'):L('اتسجلت الجرعة واتخصمت من القلم','Dose logged and subtracted from the pen');
  }else if(kind==='pen'){
    const total=num('fTotal');if(!total)return err(L('اكتب إجمالي القلم','Enter the pen total'));
    data={strength:parseFloat(sheetState.strength)||null,total,price:num('fPrice'),opened:v('fOpened')||today(),label:v('fLabel'),clicks:num('fClicks')};msg=eid?L('اتعدل القلم','Pen updated'):L('اتضاف القلم','Pen added');
  }else if(kind==='meal'){
    const text=v('fText');if(!text)return err(L('اكتب أكلت إيه','Write what you ate'));
    data={person:sheetState.person,type:sheetState.type,text,protein:num('fProt'),kcal:num('fKcal'),date:v('fDate')||today()};msg=eid?L('اتعدلت الأكلة','Meal updated'):L('اتسجلت الأكلة','Meal logged');
  }else if(kind==='weight'){
    const kg=num('fKg');if(!(kg>20&&kg<400))return err(L('اكتب الوزن بالكيلو','Enter weight in kg'));
    data={person:sheetState.person,kg,date:v('fDate')||today()};WFIELDS().forEach(([id,k])=>data[k]=num(id));msg=eid?L('اتعدل الوزن','Weight updated'):L('اتسجل الوزن','Weight logged');
  }else if(kind==='person'){
    const name=v('fName');if(!name)return err(L('اكتب الاسم','Enter a name'));
    const ppl={};PIDS().forEach(p=>ppl[p]={name:S.people[p].name,c:cidx(p)});
    const id=eid||('p'+uid());ppl[id]={name,c:parseInt(sheetState.c)||0};
    closeSheet();await savePeople(ppl);toast(eid?L('اتعدل الشخص','Person updated'):L('اتضاف ','Added ')+name);return;
  }
  closeSheet();
  if(eid)await updRow(COLL_OF[kind],eid,data);else await addRow(COLL_OF[kind],data);
  toast(msg);
}
async function estimateMeal(){
  const msg=$('#calcMsg'),btn=$('#calcBtn'),text=($('#fText')?.value||'').trim();
  if(!text){msg.textContent=L('اكتب الأول أكلت إيه وكمياته.','First write what you ate and how much.');return}
  if(!sampleFn)return;btn.disabled=true;msg.textContent=L('بيحسب…','Estimating…');
  try{
    const r=await sampleFn.json(`Estimate the total calories and protein for this meal. It may be written in Egyptian Arabic and include Egyptian dishes (e.g. foul, ta'meya, koshari, baladi bread, molokhia). Assume typical Egyptian home portions when amounts are missing. Reply with only JSON: {"kcal": number, "protein": number (grams), "note": short note in ${lang==='en'?'English':'Egyptian Arabic'} listing the main items and assumed portions (max 120 chars)}.\n\nMeal: ${text.slice(0,1500)}`,{modelTier:'quick'});
    if(!r||typeof r!=='object')throw {code:'invalid_json'};
    if(typeof r.kcal==='number')$('#fKcal').value=Math.round(r.kcal);
    if(typeof r.protein==='number')$('#fProt').value=Math.round(r.protein);
    msg.textContent=(typeof r.note==='string'?r.note.slice(0,200)+' — ':'')+L('تقدير تقريبي، عدّل لو محتاج.','A rough estimate; adjust if needed.');
  }catch(e){const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'){$('#calcBtn')?.closest('.scan')?.remove();toast(L('الحساب التلقائي مش متاح هنا، اكتب الأرقام بإيدك','Auto-estimate isn’t available here; type the numbers.'));return}
    msg.textContent=c==='rate_limited'?L('طلبات كتير، استنى شوية.','Too many requests, wait a bit.'):L('مقدرتش أحسب، جرّب تاني أو اكتبها بإيدك.','Couldn’t estimate. Try again or type them.');
  }finally{if(btn)btn.disabled=false}
}
async function scanImage(file){
  const msg=$('#scanMsg'),btn=$('#scanBtn');if(!file||!sampleFn)return;
  btn.disabled=true;msg.textContent=L('بيقرا الصورة…','Reading the image…');
  const prompt=`This image is a screenshot from a smart body-composition scale app (labels may be English or Arabic). Read the values exactly as shown. Reply with only one JSON object with these keys, using numbers (no units) or null when a value is not shown:
{"kg": weight in kg, "fat": body fat percent, "muscle": muscle mass kg, "visceral": visceral fat level, "water": body water percent, "bmi": BMI, "bmr": BMR kcal, "skeletal": skeletal muscle mass kg, "protein": protein percent, "date": "YYYY-MM-DD" if a measurement date is visible else null}`;
  try{
    const r=await sampleFn.json(prompt,{images:[file]});
    if(!r||typeof r!=='object')throw {code:'invalid_json'};
    const set=(id,x)=>{const el=$('#'+id);if(el&&typeof x==='number'&&isFinite(x))el.value=x};
    const WF=WFIELDS();set('fKg',r.kg);WF.forEach(([id,k])=>set(id,r[k]));
    if(typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))$('#fDate').value=r.date;
    $('#moreBox').open=true;
    const got=['kg',...WF.map(f=>f[1])].filter(k=>typeof r[k]==='number').length;
    msg.textContent=got?L(`اتقرا ${got} رقم. راجعهم واختار الشخص وبعدين احفظ.`,`Read ${got} values. Check them, pick the person, then save.`):L('مقدرتش ألاقي أرقام في الصورة. جرّب صورة أوضح.','No numbers found. Try a clearer screenshot.');
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable'){canImg=false;$('.scan')?.remove();toast(L('قراءة الصور مش متاحة هنا، اكتب الأرقام بإيدك','Image reading isn’t available here. Enter the numbers by hand.'));return}
    msg.textContent=c==='rate_limited'?L('طلبات كتير، استنى شوية وجرّب تاني.','Too many requests. Wait a bit and try again.'):c==='image_rejected'?L('الصورة مش مقبولة، جرّب صورة تانية.','That image can’t be used. Try another.'):L('مقدرتش أقرا الصورة، جرّب تاني أو اكتب الأرقام بإيدك.','Couldn’t read the image. Try again or type the numbers.');
  }finally{if(btn)btn.disabled=false}
}

const TABS=()=>[['dash',L('الرئيسية','Home'),'<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>'],
  ['doses',L('الجرعات','Doses'),'<path d="M5 19l4-4M9 15l8.5-8.5a2.1 2.1 0 0 0-3-3L6 12l3 3zM14 4l6 6M12 9l3 3" />'],
  ['share',L('قلم شير','Pen share'),'<rect x="9" y="2.5" width="6" height="19" rx="2"/><path d="M9 8h6M12 11v5"/>'],

  ['weights',L('الوزن','Weight'),'<rect x="3.5" y="4" width="17" height="16" rx="4"/><path d="M8.5 9a5 5 0 0 1 7 0L12 12"/>']];
function render(){
  renderStatic();renderWho();renderPeople();
  const V={dash:vDash,doses:vDoses,share:vShare,sim:vSim,meals:vMeals,weights:vWeights,settings:vSettings};
  $('#main').innerHTML=(V[view]||vDash)();
  $('#tabs').innerHTML=TABS().map(([k,l,ic])=>`<button type="button" data-tab="${k}" ${view===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}</button>`).join('');

}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.dataset.who){who=t.dataset.who;render();return}
  if(t.dataset.tab){view=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.dataset.open){openSheet(t.dataset.open);return}
  if(t.id==='btnSettings'){view='settings';render();window.scrollTo({top:0});return}
  if(t.dataset.lang){lang=t.dataset.lang;try{localStorage.setItem('mongu-lang',lang)}catch{}closeSheet();render();return}
  if(t.id==='saveClicks'){const v=parseFloat($('#appClicks').value);if(!(v>0))return toast(L('اكتب رقم صحيح','Enter a valid number'));APP.clicks=Math.round(v);saveApp();toast(L('اتحفظ','Saved'));return}
  if(t.id==='btnExport'){exportJson();return}
  if(t.id==='btnCsv'){exportCsv();return}
  if(t.id==='btnImport'){$('#importFile').click();return}
  if(t.id==='calcBtn'){estimateMeal();return}
  if(t.id==='scanBtn'){$('#scanFile').click();return}
  if(t.dataset.person){openSheet('person',t.dataset.person);return}
  if(t.dataset.close&&(e.target===t||t.tagName==='BUTTON')){closeSheet();return}
  if(t.dataset.edit){const [c,id]=t.dataset.edit.split(':');const rec=S[c].find(r=>r.id===id);const kind={doses:'dose',pens:'pen',meals:'meal',weights:'weight'}[c];if(rec)openSheet(kind,rec);return}
  if(t.dataset.step){const [p,d]=t.dataset.step.split(':');sim.d[p]=Math.max(0,Math.round(((+sim.d[p]||0)+parseFloat(d))*100)/100);const i=$('#s_'+p);if(i)i.value=sim.d[p];updateSim();return}
  if(t.dataset.del||t.dataset.pdel){
    if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent=L('متأكد؟','Sure?');setTimeout(()=>{if(t.isConnected){t.classList.remove('arm');t.textContent=L('حذف','Delete')}},3000);return}
    if(t.dataset.pdel){const p=t.dataset.pdel;
      if(S.doses.some(d=>d.person===p)||S.weights.some(w=>w.person===p)||S.meals.some(m=>m.person===p))return toast(L('الشخص ده ليه سجلات. امسحها الأول أو غيّر اسمه بدل الحذف','This person has entries. Delete them first, or rename instead.'));
      if(PIDS().length<=1)return toast(L('لازم يفضل شخص واحد على الأقل','Keep at least one person'));
      const ppl={};PIDS().filter(x=>x!==p).forEach(x=>ppl[x]={name:S.people[x].name,c:cidx(x)});if(who===p)who='all';savePeople(ppl);return}
    const [c,id]=t.dataset.del.split(':');delRow(c,id);return}
  const chips=t.closest('[data-chips]');
  if(chips){const k=chips.dataset.chips;sheetState[k]=t.dataset.v;chips.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));
    if(k==='every'){sim.every=parseInt(t.dataset.v)||7;updateSim()}
    if(k==='strength'){$('#fTotal').value=parseFloat(t.dataset.v)*4}
    if(k==='person'&&$('#fMg')&&!sheetState.editId){const l=lastDose(t.dataset.v);if(l)$('#fMg').value=+l.mg}
  }
});
function syncClk(from){
  const pen=S.pens.find(p=>p.id===($('#fPen')||{}).value);const box=$('#clkBox');if(!box)return;
  const mgI=$('#fMg'),cI=$('#fClk'),h=$('#clkHint');
  if(!(pen&&+pen.strength>0&&perDose(pen)>0)){cI.disabled=true;cI.value='';h.textContent=L('القلم ده مكتوبش عليه التركيز، عدّل بياناته.','This pen has no strength set; edit it.');return}
  cI.disabled=false;h.textContent=L(`قلم ${n(+pen.strength)}: كل ${n(perDose(pen),0)} تكة = ${n(+pen.strength)} مجم، يعني التكة ≈ ${n(+pen.strength/perDose(pen),3)} مجم`,`${n(+pen.strength)} mg pen: ${n(perDose(pen),0)} clicks = ${n(+pen.strength)} mg, so 1 click ≈ ${n(+pen.strength/perDose(pen),3)} mg`);
  if(from==='clk'){const c=parseFloat(cI.value);if(c>0)mgI.value=n(c/perDose(pen)*+pen.strength,2)}
  else{const c=clk(parseFloat(mgI.value),pen);cI.value=c==null?'':n(c,0)}
}
const AR_DIG=/[\u0660-\u0669\u06F0-\u06F9\u066B\u066C\u060C]/g;
function normNum(str){return String(str).replace(AR_DIG,c=>{const k=c.charCodeAt(0);if(k>=0x660&&k<=0x669)return String(k-0x660);if(k>=0x6F0&&k<=0x6F9)return String(k-0x6F0);return c==='\u066C'?'':'.'}).replace(/,/g,'.').replace(/[^0-9.\-]/g,'').replace(/(\..*)\./g,'$1')}
document.addEventListener('input',e=>{const el=e.target;if(el&&el.tagName==='INPUT'&&/^(decimal|numeric)$/.test(el.getAttribute('inputmode')||'')){const v=normNum(el.value);if(v!==el.value)el.value=v}},true);
document.addEventListener('input',e=>{if(e.target.id==='fMg')syncClk('mg');if(e.target.id==='fClk')syncClk('clk');const p=e.target.dataset&&e.target.dataset.sim;if(p){sim.d[p]=parseFloat(e.target.value)||0;updateSim()}});
document.addEventListener('change',e=>{if(e.target.id==='sPen'){sim.pen=e.target.value;render()}if(e.target.id==='fPen')syncClk('mg');if(e.target.id==='importFile'){const f=e.target.files&&e.target.files[0];if(f)importJson(f);e.target.value=''}
  if(e.target.id==='scanFile'){scanImage(e.target.files&&e.target.files[0]);e.target.value=''}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='sheetForm')submitSheet(f.dataset.kind)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

render();
initStore();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
